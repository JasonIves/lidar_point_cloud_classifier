[package]
name = "lidar_point_cloud_classifier"
version = "0.1.0"
edition = "2021"
description = "Whitebox Next Gen LiDAR point-cloud classifier — Stage 01/02/03"

[features]
# `training` always includes GPU support (burn wgpu backend) with runtime
# fallback to CPU NdArray when no GPU adapter is found.  Per AGENTS.md:
# "If a GPU is available, it may be utilized for acceleration; if it is
# absent, the tool must fallback gracefully and run efficiently on the CPU."
training = ["dep:burn", "burn/wgpu", "dep:wgpu"]
# `gpu` is now an alias for `training` (kept for backwards compatibility).
gpu = ["training"]

[[bin]]
name = "wb_lidar_classify"
path = "src/main.rs"

[[bin]]
name = "wb_lidar_train"
path = "src/bin/wb_lidar_train.rs"
required-features = ["training"]

[dependencies]
# Whitebox Next Gen — pinned git dependencies (NOT crates.io, NOT local path).
# `wbcore`/`wbtools_oss` are unpublished (`publish = false`) experimental crates;
# a git dependency is the only "online" (non-local-path) way to depend on them.
#
# HARD RULE: every whitebox-* crate below MUST share the identical `git` URL and
# `rev`. Never mix a git-sourced Whitebox crate with a crates.io-sourced one —
# doing so creates duplicate, incompatible copies of shared types (`Raster`,
# `PointRecord`, etc.). See docs/stages/stage-30-whitebox-git-dependency-integration.md.
#
# Upstream: https://github.com/jblindsay/whitebox_next_gen
# Pinned rev: d8d9a02a28995faf7cac1f50680ec04f0113de13 (2026-06-04)
wblidar     = { git = "https://github.com/jblindsay/whitebox_next_gen", rev = "d8d9a02a28995faf7cac1f50680ec04f0113de13", features = ["parallel"] }
wbraster    = { git = "https://github.com/jblindsay/whitebox_next_gen", rev = "d8d9a02a28995faf7cac1f50680ec04f0113de13" }
wbcore      = { git = "https://github.com/jblindsay/whitebox_next_gen", rev = "d8d9a02a28995faf7cac1f50680ec04f0113de13" }
wbtools_oss = { git = "https://github.com/jblindsay/whitebox_next_gen", rev = "d8d9a02a28995faf7cac1f50680ec04f0113de13" }


# Parallelism
rayon = "1"

# Spatial indexing
kdtree = "0.8.0"

# Linear algebra for eigenvalue decomposition
nalgebra = "0.34.1"

# Error handling
thiserror = "1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Zero-copy byte casting for .feat file writes
bytemuck = { version = "1", features = ["derive"] }

# Seeded point sampling
rand = "0.10.0"

# N-D array library for PointNet forward pass matrix operations
ndarray = "0.16"

# Training framework — optional; only compiled when `--features training`
burn = { version = "0.16", features = ["ndarray", "autodiff"], optional = true }

# GPU compute backend — optional; only compiled when `--features gpu`.
# Used solely for runtime GPU adapter detection (`gpu_is_available`). wgpu is
# already a transitive dependency of burn-wgpu, so this adds zero additional
# compile cost.
wgpu = { version = "23", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Must be "unwind" (not "abort") so that `std::panic::catch_unwind` in
# `src/training/backend.rs` can intercept wgpu VRAM-exhaustion panics and
# fall back to the CPU backend.  See Stage 09, DoD #7.
panic = "unwind"

[profile.dev]
opt-level = 1