[package]
name = "lidar_point_cloud_classifier"
version = "0.1.0"
edition = "2021"
description = "Whitebox Next Gen LiDAR point-cloud classifier — Stage 01/02/03"

[features]
# `training` always includes GPU support (burn wgpu backend) with runtime
# fallback to CPU NdArray when no GPU adapter is found.  Per AGENTS.md:
# "If a GPU is available, it may be utilized for acceleration; if it is
# absent, the tool must fallback gracefully and run efficiently on the CPU."
training = ["dep:burn", "burn/wgpu", "dep:wgpu"]
# `gpu` is now an alias for `training` (kept for backwards compatibility).
gpu = ["training"]

[[bin]]
name = "wb_lidar_classify"
path = "src/main.rs"

[[bin]]
name = "wb_lidar_train"
path = "src/bin/wb_lidar_train.rs"
required-features = ["training"]

[dependencies]
# Whitebox Next Gen path dependencies (read-only; never modify these crates)
wblidar     = { path = "../whitebox_next_gen/crates/wblidar",     features = ["parallel"] }
# TEMP (2026-06-17): wbcore and wbtools_oss commented out for build speed.
# These were used only in preprocessing/pipeline.rs::run_outlier_removal().
# The algorithm has been reimplemented locally in src/preprocessing/outlier_filter.rs.
# To revert: uncomment below, delete outlier_filter.rs, see stage-04-outlier-removal.md.
# wbcore      = { path = "../whitebox_next_gen/crates/wbcore" }
# wbtools_oss = { path = "../whitebox_next_gen/crates/wbtools_oss" }
wbraster    = { path = "../whitebox_next_gen/crates/wbraster" }

# Parallelism
rayon = "1"

# Spatial indexing
kdtree = "0.8.0"

# Linear algebra for eigenvalue decomposition
nalgebra = "0.34.1"

# Error handling
thiserror = "1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Zero-copy byte casting for .feat file writes
bytemuck = { version = "1", features = ["derive"] }

# Seeded point sampling
rand = "0.10.0"

# N-D array library for PointNet forward pass matrix operations
ndarray = "0.16"

# Training framework — optional; only compiled when `--features training`
burn = { version = "0.16", features = ["ndarray", "autodiff"], optional = true }

# GPU compute backend — optional; only compiled when `--features gpu`.
# Used solely for runtime GPU adapter detection (`gpu_is_available`). wgpu is
# already a transitive dependency of burn-wgpu, so this adds zero additional
# compile cost.
wgpu = { version = "23", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Must be "unwind" (not "abort") so that `std::panic::catch_unwind` in
# `src/training/backend.rs` can intercept wgpu VRAM-exhaustion panics and
# fall back to the CPU backend.  See Stage 09, DoD #7.
panic = "unwind"

[profile.dev]
opt-level = 1